# Builds ghcr.io/<owner>/immich:vX.Y.Z-360: ImageGenius' image for Immich X.Y.Z with
# the web of branch 360/vX.Y.Z (360 viewer). See docker/360/Dockerfile.
name: 360 image

on:
  push:
    branches: ['360/v*']
    paths-ignore: ['.devcontainer/**']
  workflow_dispatch:

permissions: {}

concurrency:
  group: 360-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: startsWith(github.ref_name, '360/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Versions and base image digest
        id: meta
        env:
          REF: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          version="${REF#360/}"                     # v3.3.5
          base="ghcr.io/imagegenius/immich:${version#v}"
          digest=$(docker buildx imagetools inspect "$base" --format '{{json .Manifest}}' | jq -r .digest)
          image="ghcr.io/${OWNER,,}/immich"
          {
            echo "base=$base@$digest"
            echo "tags=$image:$version-360,$image:$version-360-${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"
          echo "Base: $base@$digest" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/360/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BASE_IMAGE=${{ steps.meta.outputs.base }}
            BUILD_ID=${{ github.run_id }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.base.name=${{ steps.meta.outputs.base }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
